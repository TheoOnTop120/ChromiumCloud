<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings - Chromium Cloud</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="topbar">
  <div class="container nav">
    <div class="brand"><div class="logo">C</div>Chromium Cloud</div>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/session">Browser</a>
      <a href="/settings">Settings</a>
      <a href="/profile">Profile</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</div>
<div class="container" style="max-width:640px;padding:40px 24px;">
  <div class="muted small" style="font-family:var(--mono);text-transform:uppercase;margin-bottom:8px;">Account / Preferences</div>
  <h1 style="font-size:44px;line-height:1;letter-spacing:-.05em;margin:0 0 12px;">Account settings</h1>
  <p class="muted" style="margin:0 0 24px;"><a href="/dashboard">Back to dashboard</a></p>
  <div class="card">
    <div class="field"><label>Display name</label><input id="dn" class="input"></div>
    <div class="field"><label>Email</label><input id="em" class="input"></div>
    <div class="field"><label>New password (min 12)</label><input id="pw" class="input" type="password"></div>
    <button class="btn btn-primary" onclick="save()">Save changes</button>
    <p id="msg" style="margin-top:12px;font-size:13px;color:var(--muted);"></p>
  </div>
</div>
<script>
async function csrf(){const r=await fetch('/api/csrf',{credentials:'same-origin'});const j=await r.json();return j.csrfToken;}
async function save(){
  const r=await fetch('/api/user/profile',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json','Origin':location.origin,'X-CSRF-Token':await csrf()},body:JSON.stringify({displayName:document.getElementById('dn').value,email:document.getElementById('em').value,password:document.getElementById('pw').value})});
  const j=await r.json().catch(()=>({}));
  document.getElementById('msg').textContent=r.ok?'Saved.':(j.error||'Error');
}
</script>
</body>
</html>
