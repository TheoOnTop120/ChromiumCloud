<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Chromium Cloud</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="topbar">
  <div class="container nav">
    <div class="brand"><div class="logo">C</div>Chromium Cloud</div>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/session">Browser</a>
      <a href="/settings">Settings</a>
      <a href="/profile">Profile</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span id="who" class="muted small"></span>
      <a class="btn btn-ghost btn-sm" href="#" onclick="logout();return false;">Logout</a>
    </div>
  </div>
</div>

<main class="container" style="padding:56px 24px 80px;">
  <div style="display:flex;justify-content:space-between;align-items:end;margin-bottom:28px;gap:20px;">
    <div>
      <div class="muted small" style="font-family:var(--mono);text-transform:uppercase;margin-bottom:8px;">Workspace / Overview</div>
      <h1 style="font-size:44px;line-height:1;letter-spacing:-.05em;margin:0;">Your browser</h1>
    </div>
  </div>

  <div class="grid grid-2" style="max-width:980px;">
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:start;">
        <div>
          <h2 style="margin:0 0 6px;font-size:18px;">Personal session</h2>
          <p class="muted small" style="margin:0 0 20px;">Private Chromium environment</p>
        </div>
        <span class="badge badge-accent">Live</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">
        <button class="btn btn-primary" onclick="openBrowser()">Open browser</button>
        <button class="btn btn-secondary" onclick="start()">Start</button>
        <button class="btn btn-secondary" onclick="stop()">Stop</button>
      </div>
      <div id="status" class="status" style="padding:12px 14px;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);">Loading...</div>
      <div class="grid grid-3" style="margin-top:16px;">
        <div class="stat-card"><div class="stat-label">State</div><div class="stat-value" id="st" style="font-size:20px;">-</div></div>
        <div class="stat-card"><div class="stat-label">Active sessions</div><div class="stat-value" id="ac" style="font-size:20px;">-</div></div>
        <div class="stat-card"><div class="stat-label">Limit</div><div class="stat-value" id="mx" style="font-size:20px;">-</div></div>
      </div>
    </section>
    <div class="card" id="adminCard" style="display:none;">
      <h3 style="margin:0 0 6px;">Administration</h3>
      <p class="muted small" style="margin:0 0 16px;">You are an administrator.</p>
      <a href="/admin" class="btn btn-primary">Open admin panel</a>
    </div>
  </div>
</main>

<script>
async function me(){const r=await fetch('/api/auth/me',{credentials:'same-origin'});if(!r.ok){location.href='/login';return;}const j=await r.json();document.getElementById('who').textContent=j.user.username+' ('+j.user.role+')';if(j.user.role==='admin')document.getElementById('adminCard').style.display='block';}
async function csrf(){const r=await fetch('/api/csrf',{credentials:'same-origin'});const j=await r.json();return j.csrfToken;}
async function start(){const r=await fetch('/api/container/start',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()}});const j=await r.json().catch(()=>({}));toast(r.ok?'Browser started.':'Error: '+(j.error||r.status));status();}
async function stop(){await fetch('/api/container/stop',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':await csrf()}});toast('Stop requested');status();}
async function logout(){await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':await csrf()}});location.href='/login';}
function openBrowser(){window.open('/session','_blank');}
async function status(){const r=await fetch('/api/container/status',{credentials:'same-origin'});if(r.ok){const j=await r.json();document.getElementById('status').textContent='State: '+(j.running?'running':'stopped')+' | active sessions: '+j.active+'/'+j.max;document.getElementById('st').textContent=j.running?'Running':'Stopped';document.getElementById('ac').textContent=j.active;document.getElementById('mx').textContent=j.max;}}
function toast(msg){const s=document.getElementById('status');const p=s.textContent;s.textContent=msg;setTimeout(status,2000);}
me();status();setInterval(status,10000);
</script>
</body>
</html>
