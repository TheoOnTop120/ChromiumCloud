<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session - Chromium Cloud</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body style="overflow:hidden;">
<div class="session-bar">
  <div class="logo" style="width:28px;height:28px;font-size:13px;">C</div>
  <span class="title">Cloud browser</span>
  <span id="status" class="status">Starting…</span>
  <button class="btn btn-secondary btn-sm" onclick="start()">Start</button>
  <button class="btn btn-secondary btn-sm" onclick="stop()">Stop</button>
  <button class="btn btn-primary btn-sm" onclick="fs()">Fullscreen</button>
  <a class="btn btn-ghost btn-sm" href="/dashboard">Dashboard</a>
  <button class="theme-toggle" data-theme-toggle aria-label="Theme" style="width:32px;height:32px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
<iframe id="fr" class="browser" src="/browser/"></iframe>
<script>
async function csrf(){const r=await fetch('/api/csrf',{credentials:'same-origin'});const j=await r.json();return j.csrfToken;}
async function start(){const r=await fetch('/api/container/start',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':await csrf()}});const j=await r.json().catch(()=>({}));document.getElementById('status').textContent=r.ok?'Running':'Error: '+(j.error||r.status);}
async function stop(){await fetch('/api/container/stop',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':await csrf()}});document.getElementById('status').textContent='Stopped';}
function fs(){const f=document.getElementById('fr'); if(f.requestFullscreen) f.requestFullscreen();}
async function status(){const r=await fetch('/api/container/status',{credentials:'same-origin'});if(r.ok){const j=await r.json();document.getElementById('status').textContent=j.running?'Running':'Stopped'; if(!j.running) start();}}
status(); setInterval(status,15000);
</script>
</body>
</html>
