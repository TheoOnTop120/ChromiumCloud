<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile - Chromium Cloud</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="topbar">
  <div class="container nav">
    <div class="brand"><div class="logo">C</div>Chromium Cloud</div>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/session">Browser</a>
      <a href="/settings">Settings</a>
      <a href="/profile">Profile</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</div>
<div class="container" style="max-width:640px;padding:40px 24px;">
  <div class="muted small" style="font-family:var(--mono);text-transform:uppercase;margin-bottom:8px;">Account / Identity</div>
  <h1 style="font-size:44px;line-height:1;letter-spacing:-.05em;margin:0 0 12px;">Profile</h1>
  <p class="muted" style="margin:0 0 24px;"><a href="/dashboard">Back to dashboard</a></p>
  <div class="card" id="info">Loading…</div>
</div>
<script>
fetch('/api/auth/me',{credentials:'same-origin'}).then(r=>r.json()).then(j=>{
  const u=j.user;
  document.getElementById('info').innerHTML=`
    <div class="profile-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;">
      <div><div class="muted small" style="font-family:var(--mono);text-transform:uppercase;">Username</div><div style="font-weight:700;margin-top:4px;">${u.username}</div></div>
      <div><div class="muted small" style="font-family:var(--mono);text-transform:uppercase;">Role</div><div style="font-weight:700;margin-top:4px;">${u.role}</div></div>
      <div><div class="muted small" style="font-family:var(--mono);text-transform:uppercase;">Display name</div><div style="font-weight:700;margin-top:4px;">${u.displayName}</div></div>
      <div><div class="muted small" style="font-family:var(--mono);text-transform:uppercase;">Email</div><div style="font-weight:700;margin-top:4px;word-break:break-word;">${u.email||'-'}</div></div>
    </div>`;
});
</script>
</body>
</html>
