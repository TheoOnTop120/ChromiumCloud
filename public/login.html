<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Chromium Cloud</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
      <div class="logo">C</div>
      <div>
        <div style="font-weight:700;font-size:18px;">Chromium Cloud</div>
        <div class="muted small">Sign in to your browser</div>
      </div>
      <button class="theme-toggle" data-theme-toggle style="margin-left:auto;" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="muted small" style="font-family:var(--mono);text-transform:uppercase;margin-bottom:12px;">Account access</div>
    <h1>Welcome back</h1>
    <p class="sub">Enter the workspace assigned to you.</p>
    <div class="field"><label>Username</label><input id="u" class="input" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="p" class="input" type="password" autocomplete="current-password"></div>
    <button id="btn" class="btn btn-primary" style="width:100%;margin-top:6px;" onclick="login()">Sign in</button>
    <div class="err" id="err" style="color:var(--danger);font-size:12px;margin-top:10px;min-height:16px;"></div>
    <div style="margin-top:18px;display:flex;justify-content:space-between;font-size:13px;">
      <a href="/register">Create account</a>
      <a href="/forgot-password">Forgot password?</a>
    </div>
  </div>
</div>
<script>
const btn=document.getElementById('btn');
const err=document.getElementById('err');
async function login(){
  err.textContent='';
  btn.disabled=true;btn.textContent='Signing in...';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){err.textContent=j.error||'Sign in failed';return;}
    location.href='/dashboard';
  }catch(e){err.textContent='Network error';}
  finally{btn.disabled=false;btn.textContent='Sign in';}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
