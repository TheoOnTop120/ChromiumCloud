<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - Chromium Cloud</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
      <div class="logo">C</div>
      <div style="font-weight:700;font-size:18px;">Chromium Cloud</div>
      <button class="theme-toggle" data-theme-toggle style="margin-left:auto;" aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="muted small" style="font-family:var(--mono);text-transform:uppercase;margin-bottom:12px;">New workspace</div>
    <h1>Create account</h1>
    <p class="sub">Register if public signup is enabled.</p>
    <div class="field"><label>Username</label><input id="u" class="input"></div>
    <div class="field"><label>Password (min 12)</label><input id="p" class="input" type="password"></div>
    <div class="field"><label>Email (optional)</label><input id="e" class="input"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:6px;" onclick="reg()">Create account</button>
    <div class="err" id="err" style="color:var(--danger);font-size:12px;margin-top:10px;min-height:16px;"></div>
    <div style="margin-top:18px;font-size:13px;"><a href="/login">Back to login</a></div>
  </div>
</div>
<script>
async function reg(){
  const err=document.getElementById('err'); err.textContent='';
  const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json','Origin':location.origin},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value,email:document.getElementById('e').value})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){err.textContent=j.error||'Error';return;}
  location.href='/login';
}
</script>
</body>
</html>
