<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password - Chromium Cloud</title>
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="muted small" style="font-family:var(--mono);text-transform:uppercase;margin-bottom:12px;">Account recovery</div>
    <h1>Forgot password</h1>
    <p class="sub">Submit your username; an administrator will reset your access.</p>
    <div class="field"><label>Username</label><input id="u" class="input"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:6px;" onclick="submit()">Submit</button>
    <p id="msg" style="margin-top:12px;font-size:13px;color:var(--muted);"></p>
    <div style="margin-top:18px;font-size:13px;"><a href="/login">Back to login</a></div>
  </div>
</div>
<script>
async function submit(){
  const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json','Origin':location.origin},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('u').value})});
  const j=await r.json().catch(()=>({}));
  document.getElementById('msg').textContent=j.message||'Done.';
}
</script>
</body>
</html>
